services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tgm
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: tgm
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tgm -d tgm"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://tgm:${DB_PASSWORD}@db:5432/tgm
      BOT_TOKEN: ${BOT_TOKEN}
      TRUST_PROXY: "true"
    ports: ["127.0.0.1:3000:3000"]
    volumes: [uploads:/data/uploads]
volumes:
  pgdata:
  uploads:
